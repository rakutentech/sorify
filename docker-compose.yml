name: sorify

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      VITE_APP_NAME: ${APP_NAME:-Sorify}
      ASSET_URL: ${ASSET_URL:-}
  image: sorify-app:latest
  env_file:
    - .env.docker
  volumes:
    - storage_data:/app/storage
    # Ephemeral execution mode: shared staging dir for test specs/screenshots
    # (bind-mounts into runner containers on the rootless daemon) + the
    # rootless daemon socket. No-ops in local mode.
    - ${SORIFY_RUNS_DIR:-/srv/sorify/runs}:/app/storage/app/tmp
    - ${SORIFY_RUNNER_SOCKET:-/run/user/1500/docker.sock}:/var/run/sorify-docker.sock:ro
  environment:
    - SORIFY_EXECUTION_DOCKER_HOST=unix:///var/run/sorify-docker.sock
    - SORIFY_EXECUTION_HOST_RUNS_DIR=${SORIFY_RUNS_DIR:-/srv/sorify/runs}
    # Local-mode safety net: drop node test processes to the unprivileged
    # sorify-test user (created in the Dockerfile) with kernel-enforced caps.
    - SORIFY_LOCAL_TEST_UID=2000
  depends_on:
    mysql:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app-image
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "php artisan migrate --force && php artisan db:seed --class=AdminUserSeeder --force"]

  app:
    <<: *app-image
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"

  queue:
    <<: *app-image
    restart: unless-stopped
    deploy:
      replicas: 3
    # --timeout is only the default for jobs without their own timeout();
    # RunSingleTestJob overrides it. `agent` is listed last as a fallback:
    # these workers only pull agent turns when the test queues are empty,
    # so tests never starve and agent turns still run if the dedicated
    # agent workers are all down.
    command: ["php", "artisan", "queue:work", "--queue=sorify,default,agent", "--tries=1", "--timeout=600", "--sleep=3"]
    environment:
      # Must exceed the largest possible job timeout these workers can
      # pick up: the agent job's 3720s (60 min max run + 120s headroom),
      # else a still-running job is re-released and double-executed.
      # (600s timeout_ms + 10) * (1 + 3 max retries) + 30 = 2470s for
      # tests also fits under this.
      - DB_QUEUE_RETRY_AFTER=3800

  # Dedicated workers for AI agent turns (RunAgentTurnJob): agent turns run
  # up to an hour and must not sit behind test executions, and vice versa.
  agent-queue:
    <<: *app-image
    restart: unless-stopped
    deploy:
      replicas: 1
    # --timeout is the default for jobs without their own timeout(); the
    # agent job overrides it with max run minutes * 60 + 120 (≤ 3720s).
    command: ["php", "artisan", "queue:work", "--queue=agent", "--tries=1", "--timeout=3720", "--sleep=3"]
    environment:
      - DB_QUEUE_RETRY_AFTER=3800

  scheduler:
    <<: *app-image
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]

volumes:
  mysql_data:
  storage_data:
