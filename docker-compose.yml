name: sorify

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      VITE_APP_NAME: ${APP_NAME:-Sorify}
      ASSET_URL: ${ASSET_URL:-}
  image: sorify-app:latest
  env_file:
    - .env.docker
  volumes:
    - storage_data:/app/storage
  depends_on:
    mysql:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app-image
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "php artisan migrate --force && php artisan db:seed --class=AdminUserSeeder --force"]

  app:
    <<: *app-image
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"

  queue:
    <<: *app-image
    restart: unless-stopped
    deploy:
      replicas: 3
    # --timeout is only the default for jobs without their own timeout();
    # RunSingleTestJob overrides it. DB_QUEUE_RETRY_AFTER must exceed the
    # largest possible job timeout: (600s timeout_ms + 10) * (1 + 3 max
    # retries) + 30 = 2470s, else a still-running job is re-released to the
    # queue and double-executed.
    command: ["php", "artisan", "queue:work", "--queue=sorify,default", "--tries=1", "--timeout=600", "--sleep=3"]
    environment:
      - DB_QUEUE_RETRY_AFTER=2520

  scheduler:
    <<: *app-image
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]

volumes:
  mysql_data:
  storage_data:
