<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sorify Recorder</title>
    <style>
      :root {
        --navy: #22314f;
        --blue: #8fd3f4;
        --blue-dark: #4aa9e0;
        --yellow: #ffd166;
        --green: #2a8f4b;
        --red: #c33;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        width: 300px;
        margin: 0;
        padding: 16px;
        color: var(--navy);
        background: #fafbfd;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }

      .brand img {
        height: 30px;
        width: auto;
      }

      .brand .tag {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--blue-dark);
        background: #eaf6fd;
        padding: 3px 6px;
        border-radius: 5px;
      }

      .card {
        background: #fff;
        border: 1px solid #e7e9f0;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--red);
        flex-shrink: 0;
        box-shadow: 0 0 0 3px rgba(204, 51, 51, 0.12);
        transition: background 0.2s, box-shadow 0.2s;
      }

      .dot.on {
        background: var(--green);
        box-shadow: 0 0 0 3px rgba(42, 143, 75, 0.14);
      }

      #status-text {
        font-size: 12px;
        font-weight: 500;
        color: #555;
      }

      button {
        appearance: none;
        border: none;
        width: 100%;
        padding: 9px 12px;
        margin-top: 8px;
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.05s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      }

      button:active {
        transform: scale(0.98);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      #connect-btn {
        background: linear-gradient(180deg, #2f4166 0%, var(--navy) 100%);
        color: #fff;
        box-shadow: 0 1px 2px rgba(34, 49, 79, 0.25);
      }

      #connect-btn:hover:not(:disabled) {
        box-shadow: 0 2px 6px rgba(34, 49, 79, 0.35);
      }

      #record-btn {
        background: linear-gradient(180deg, #ffdb85 0%, var(--yellow) 100%);
        color: var(--navy);
        box-shadow: 0 1px 2px rgba(255, 209, 102, 0.4);
      }

      #record-btn:hover:not(:disabled) {
        box-shadow: 0 2px 6px rgba(255, 209, 102, 0.55);
      }

      #event-count {
        font-size: 11px;
        color: #777;
        margin-top: 8px;
        text-align: center;
      }

      #config {
        display: none;
        margin-top: 4px;
      }

      #config pre {
        background: #f4f6fa;
        border: 1px solid #e7e9f0;
        padding: 8px;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-all;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="icons/logo.svg" alt="Sorify" />
      <span class="tag">Recorder</span>
    </div>

    <div class="card">
      <div class="row">
        <span class="dot" id="dot"></span>
        <span id="status-text">Not connected</span>
      </div>

      <button id="connect-btn">Connect</button>
      <button id="record-btn" disabled>Start recording</button>

      <div id="event-count"></div>
    </div>

    <div id="config" class="card">
      <div id="status-text-2" style="font-size: 12px; margin-bottom: 6px;">
        Add this to your coding agent's <code>.mcp.json</code>:
      </div>
      <pre id="config-json"></pre>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
